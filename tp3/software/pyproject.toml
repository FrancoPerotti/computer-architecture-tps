[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "viewrv"
version = "0.7.0"
description = "Aplicación local para el procesador RISC-V del TP3"
requires-python = "==3.14.*"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "click==8.5.0", "httpx==0.28.1", "pyserial==3.5"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
viewrv = "software.viewrv.cli.__main__:main"
viewrv-core = "software.viewrv.core.__main__:main"

[tool.setuptools]
packages = ["software", "software.viewrv", "software.viewrv.core", "software.viewrv.adapters", "software.viewrv.client", "software.viewrv.cli", "software.viewrv.installation"]
package-dir = {software = "."}
